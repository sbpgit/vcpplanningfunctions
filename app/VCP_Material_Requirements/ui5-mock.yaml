specVersion: "3.1"
metadata:
  name: vcpapp.vcpmaterialrequirements
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - url: https://sbpbtp-vcpprovider-sc0jeojq-dev-config-products-srv.cfapps.us10.hana.ondemand.com
            authenticationType: OAuth2ClientCredentials
            destination: VCPlanneroAuth
            path: /v2
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /v2/analytical
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /v2/catalog
            metadataPath: ./webapp/localService/catService/metadata.xml
            mockdataPath: ./webapp/localService/catService/data
            generateMockData: true
        annotations: []
